name: Update LeetCode Progress

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      # Run only when solutions or scripts change, NOT when README itself changes
      - '[0-9]*/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run README Generator
        run: |
          python3 scripts/generate_readme.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          # Commit only if changes exist to avoid pipeline failures
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update LeetCode stats and solution links [skip ci]"
            git push
          else
            echo "No changes detected in README.md"
          fi
