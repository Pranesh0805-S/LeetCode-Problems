name: Update LeetCode Progress

on:
  workflow_dispatch:
  schedule:
    # 6:00 AM IST every day (00:30 UTC)
    - cron: '30 0 * * *'
  push:
    branches:
      - main
      - master
      - 'CPP-(C++)'
    paths:
      - '[0-9]*/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required for git log commit dates to work
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run README Generator
        run: |
          python3 scripts/generate_readme.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-sync LeetCode metrics and timeline [skip ci]"
            git push
          else
            echo "No changes detected in README.md"
          fi
